{% extends 'base.html' %}
{% block title %}Configurações — AstroTools{% endblock %}
{% block content %}
<h1 data-i18n="nav_config">Configurações</h1>
<article>
    <form method="post" onsubmit="this.querySelector('button[type=submit]').setAttribute('aria-busy', 'true')">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h3 data-i18n="config_profile">Perfil</h3>
        <label>
            <span data-i18n="auth_username">Username</span>
            <input type="text" name="username" value="{{ current_user.username }}">
        </label>
        <h3 data-i18n="config_change_password">Alterar Password</h3>
        <label>
            <span data-i18n="config_new_password">Nova Password</span>
            <input type="password" name="new_password">
        </label>
        
        <h3 data-i18n="config_apis_backup">APIs & Backup</h3>
        <label>
            <span>Astrometry.net API Key</span>
            <input type="text" name="astrometry_key" value="{{ current_user.astrometry_api_key or '' }}">
        </label>
        <label>
            <span>Seestar Import Path</span>
            <input type="text" name="seestar_path" value="{{ configs.get('SEESTAR_IMPORT_PATH', '') }}">
        </label>
        <label>
            <span>Rclone Remote</span>
            <input type="text" name="rclone_remote" value="{{ configs.get('RCLONE_REMOTE', '') }}">
        </label>
        <label>
            <span>Rclone Path</span>
            <input type="text" name="rclone_path" value="{{ configs.get('RCLONE_PATH', '') }}">
        </label>

        <h3 data-i18n="config_locations">Localizações</h3>
        <div class="grid">
            <label>Nome
                <input type="text" name="loc_name" placeholder="Nome do Local">
            </label>
            <label>Latitude
                <input type="text" name="lat" placeholder="0.0">
            </label>
            <label>Longitude
                <input type="text" name="lon" placeholder="0.0">
            </label>
            <label>Altitude
                <input type="text" name="elev" placeholder="0">
            </label>
        </div>
        <button type="submit" data-i18n="config_save">Guardar</button>
    </form>
</article>
{% endblock %}
