{% extends 'base.html' %}
{% block title %}Carregar Imagem — AstroTools{% endblock %}

{% block content %}
<h1>Carregar Imagem</h1>
<article>
    <form method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Ficheiro de Imagem
            <input type="file" name="image" required accept="image/*">
        </label>
        <label>Título (opcional)
            <input type="text" name="title" placeholder="Título da imagem">
        </label>
        <label>Descrição (opcional)
            <textarea name="description" rows="3"></textarea>
        </label>
        <button type="submit">Carregar</button>
        <a href="{{ url_for('gallery.index') }}" role="button" class="secondary outline">Cancelar</a>
    </form>
</article>
{% endblock %}
