{% extends 'base.html' %}
{% block title %}Carregar Imagem — AstroTools{% endblock %}

{% block content %}
<h1 data-i18n="gallery_upload">Carregar Imagem</h1>
<article>
    <form method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            <span data-i18n="gallery_image_file">Ficheiro de Imagem</span>
            <input type="file" name="image" required accept="image/*">
        </label>
        <label>
            <span data-i18n="gallery_title">Título</span> <span data-i18n="optional">(opcional)</span>
            <input type="text" name="title" data-i18n="gallery_title_placeholder" placeholder="Título da imagem">
        </label>
        <label>
            <span data-i18n="gallery_description">Descrição</span> <span data-i18n="optional">(opcional)</span>
            <textarea name="description" rows="3"></textarea>
        </label>
        <button type="submit" data-i18n="gallery_upload_short">Carregar</button>
        <a href="{{ url_for('gallery.index') }}" role="button" class="secondary outline" data-i18n="cancel">Cancelar</a>
    </form>
</article>
{% endblock %}
