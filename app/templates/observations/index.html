{% extends 'base.html' %}
{% block title %}Diário de Observações — AstroTools{% endblock %}

{% block content %}
<section>
    <div class="grid">
        <h1 data-i18n="nav_observations">Diário de Observações</h1>
        <div style="text-align: right;">
            <a href="{{ url_for('observations.add') }}" role="button" data-i18n="obs_add_btn">Nova Observação</a>
        </div>
    </div>
</section>

<section>
    {% if observations %}
    <figure>
        <table role="grid">
            <thead>
                <tr>
                    <th data-i18n="eph_date">Data</th>
                    <th data-i18n="eph_target">Alvo</th>
                    <th data-i18n="obs_notes">Notas</th>
                    <th data-i18n="astrometry_action">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for obs in observations %}
                <tr>
                    <td>{{ obs.observed_at.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td><strong>{{ obs.target }}</strong></td>
                    <td>{{ obs.notes or '—' }}</td>
                    <td>
                        <form action="{{ url_for('observations.delete', obs_id=obs.id) }}" method="post" onsubmit="return confirm(t('obs_delete_confirm'))">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="secondary outline" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" data-i18n="delete">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </figure>
    {% else %}
    <p data-i18n="obs_no_records">Ainda não registou nenhuma observação. Comece hoje!</p>
    {% endif %}
</section>
{% endblock %}
