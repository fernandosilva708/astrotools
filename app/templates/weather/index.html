{% extends 'base.html' %}
{% block title %}Meteorologia — AstroTools{% endblock %}

{% block content %}
<section>
    <h1 data-i18n="nav_weather">Meteorologia</h1>
    
    <!-- Secção de Alertas -->
    <div id="weather-alerts" style="display:none; margin-bottom: 1rem;">
        <article style="background-color: var(--pico-ins-color); border: none; color: white; padding: 1rem;">
            <p id="alert-text" style="margin: 0;"></p>
        </article>
    </div>

    <label>
        <span data-i18n="config_location_name">Localidade</span>
        <select id="location-select" onchange="loadWeather()">
            <option value="default" data-i18n="weather_lisbon_fallback">Lisboa (Fallback)</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}">{{ loc.name }}</option>
            {% endfor %}
        </select>
    </label>
</section>

<section id="weather-section">
    <div id="weather-loading" aria-busy="true">Carregando dados...</div>
    <figure id="weather-content" style="display:none;">
        <table role="grid">
            <thead>
                <tr>
                    <th data-i18n="eph_time">Hora</th>
                    <th data-i18n="weather_clouds">Nuvens</th>
                    <th data-i18n="weather_temp">Temp.</th>
                    <th data-i18n="weather_dew_point">Pto. Orvalho</th>
                    <th data-i18n="weather_humidity">Humidade</th>
                    <th data-i18n="weather_pressure">Pressão</th>
                    <th data-i18n="weather_wind">Vento</th>
                    <th data-i18n="weather_seeing">Seeing</th>
                    <th data-i18n="weather_transparency">Transparência</th>
                </tr>
            </thead>
            <tbody id="weather-tbody"></tbody>
        </table>
        <footer>
            <small>
                <span data-i18n="weather_source">Fonte:</span> <span id="weather-source"></span> | 
                <span data-i18n="weather_source_light">Dados de poluição luminosa: LightPollutionMap.info</span> |
                <span data-i18n="weather_last_update">Última atualização:</span> <span id="weather-last-update"></span>
            </small>
        </footer>
    </figure>
</section>

<script>
function loadWeather() {
    const locId = document.getElementById('location-select').value;
    const loading = document.getElementById('weather-loading');
    const tbody = document.getElementById('weather-tbody');
    loading.style.display = 'block';
    document.getElementById('weather-content').style.display = 'none';
    tbody.innerHTML = '';

    fetch(`{{ url_for('weather.api_data') }}?location_id=${locId}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                loading.textContent = "Erro: " + data.error;
                return;
            }
            loading.style.display = 'none';
            document.getElementById('weather-content').style.display = 'block';
            document.getElementById('weather-source').textContent = data.source;
            document.getElementById('weather-last-update').textContent = new Date(data.last_update).toLocaleString();

            data.forecast.forEach(f => {
                const row = `<tr>
                    <td>${f.time}</td>
                    <td><progress value="${f.clouds}" max="100"></progress> ${f.clouds}%</td>
                    <td>${f.temp}</td>
                    <td>${f.dew_point}</td>
                    <td>${f.humidity}</td>
                    <td>${f.pressure}</td>
                    <td>${f.wind}</td>
                    <td>${f.seeing}</td>
                    <td>${f.transparency}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
                
                // Lógica de Alerta Simples
                if (f.clouds < 20 && f.seeing === "Bom") {
                    document.getElementById('weather-alerts').style.display = 'block';
                    document.getElementById('alert-text').textContent = `Alerta: Céu limpo e seeing bom às ${f.time}!`;
                }
            });
        });
}
document.addEventListener('DOMContentLoaded', loadWeather);
</script>
{% endblock %}
