{% extends 'base.html' %}
{% block title %}Registar — AstroTools{% endblock %}

{% block content %}
<article style="max-width: 400px; margin: auto;">
    <h2 data-i18n="auth_create_account">Criar nova conta</h2>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            <span data-i18n="auth_username">Utilizador</span>
            <input type="text" name="username" required>
        </label>
        <label>
            <span data-i18n="auth_email">Email</span>
            <input type="email" name="email" required>
        </label>
        <label>
            <span data-i18n="auth_password">Password</span>
            <input type="password" name="password" required>
        </label>
        <button type="submit" data-i18n="auth_register">Registar</button>
    </form>
    <p><span data-i18n="auth_has_account">Já tenho conta</span> <a href="{{ url_for('auth.login') }}" data-i18n="auth_login_link">Iniciar sessão</a></p>
</article>
{% endblock %}
