{% extends 'base.html' %}
{% block title %}Entrar — AstroTools{% endblock %}

{% block content %}
<article style="max-width: 400px; margin: auto;">
    <h2 data-i18n="auth_login">Entrar</h2>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            <span data-i18n="auth_username">Utilizador</span>
            <input type="text" name="username" required autofocus>
        </label>
        <label>
            <span data-i18n="auth_password">Password</span>
            <input type="password" name="password" required>
        </label>
        <button type="submit" data-i18n="auth_login">Entrar</button>
    </form>
    <p><span data-i18n="auth_no_account">Sem conta?</span> <a href="{{ url_for('auth.register') }}" data-i18n="auth_register">Criar nova conta</a></p>
</article>
{% endblock %}
