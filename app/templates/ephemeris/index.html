{% extends 'base.html' %}
{% block title %}Efemérides — AstroTools{% endblock %}

{% block content %}
<h1 data-i18n="nav_ephemeris">Efemérides</h1>

<div class="grid">
    <article>
        <h2 data-i18n="eph_search">Pesquisa de Objeto</h2>
        <form id="ephemerisForm">
            <label>
                <span data-i18n="eph_target">Objeto Alvo</span>
                <input type="text" id="target" placeholder="e.g. Mars, M42" required>
            </label>
            <div class="grid">
                <label>
                    <span data-i18n="eph_lat">Latitude</span>
                    <input type="number" id="lat" step="0.0001" value="{{ loc.latitude }}">
                </label>
                <label>
                    <span data-i18n="eph_lon">Longitude</span>
                    <input type="number" id="lon" step="0.0001" value="{{ loc.longitude }}">
                </label>
            </div>
            <div class="grid">
                <label>
                    <span data-i18n="eph_elevation">Altitude (m)</span>
                    <input type="number" id="elevation" value="{{ loc.elevation }}">
                </label>
                <label>
                    <span data-i18n="eph_date">Data</span>
                    <input type="date" id="date">
                </label>
            </div>
            <button type="submit" data-i18n="eph_calculate">Calcular</button>
        </form>
        <button type="button" class="secondary outline" onclick="updateEphemeris()" data-i18n="eph_update_bsp">Atualizar Dados (.bsp)</button>
    </article>

    <article>
        <h2 data-i18n="eph_results">Resultados</h2>
        <div id="results">
            <p data-i18n="eph_hint">Introduza um objeto e localização para calcular as efemérides.</p>
        </div>
    </article>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('date').valueAsDate = new Date();

async function updateEphemeris() {
    const btn = event.target;
    btn.disabled = true;
    try {
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        const res = await fetch('{{ url_for("ephemeris.update_ephemeris") }}', {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken }
        });
        const data = await res.json();
        alert(data.message);
    } catch (e) {
        alert('Erro ao atualizar efemérides.');
    } finally {
        btn.disabled = false;
    }
}

document.getElementById('ephemerisForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
  const body = {
    target: document.getElementById('target').value,
    lat: parseFloat(document.getElementById('lat').value) || 0,
    lon: parseFloat(document.getElementById('lon').value) || 0,
    elevation: parseFloat(document.getElementById('elevation').value) || 0,
    date: document.getElementById('date').value,
  };
  
  const resultsDiv = document.getElementById('results');
  try {
      const res = await fetch('{{ url_for("ephemeris.calculate") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.status === 200 && data.status === 'success') {
          resultsDiv.innerHTML = `
            <table class="striped">
              <tbody>
                <tr>
                  <td><strong>${t('eph_target')}</strong></td>
                  <td>${data.target.toUpperCase()}</td>
                </tr>
                <tr>
                  <td><strong>${t('obs_ra')}</strong></td>
                  <td>${data.ra}</td>
                </tr>
                <tr>
                  <td><strong>${t('obs_dec')}</strong></td>
                  <td>${data.dec}</td>
                </tr>
                <tr>
                  <td><strong>${t('eph_elevation')}</strong></td>
                  <td>${data.alt}</td>
                </tr>
                <tr>
                  <td><strong>${t('eph_azimuth')}</strong></td>
                  <td>${data.az}</td>
                </tr>
                <tr>
                  <td><strong>${t('eph_distance')}</strong></td>
                  <td>${data.distance}</td>
                </tr>
              </tbody>
            </table>
          `;
      } else {
          resultsDiv.innerHTML = `<p class="alert alert-warning" data-i18n="eph_no_ephemeris">${t('eph_no_ephemeris')}</p>`;
      }
  } catch (err) {
      resultsDiv.innerHTML = `<p class="alert alert-warning" data-i18n="eph_no_ephemeris">${t('eph_no_ephemeris')}</p>`;
  }
});
</script>
{% endblock %}
