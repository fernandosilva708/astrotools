{% extends 'base.html' %}
{% block title %}Efemérides da ISS — AstroTools{% endblock %}

{% block content %}
<h1 data-i18n="nav_ephemeris_iss">Efemérides da ISS</h1>
<p data-i18n="eph_iss_desc">Cálculo da distância relativa entre a ISS e objetos do sistema solar.</p>

<article>
    <div class="grid">
        <label>
            <span data-i18n="eph_celestial_body">Corpo Celeste</span>
            <select id="target">
                <option value="sun" data-i18n="eph_sun">Sol</option>
                <option value="moon" data-i18n="eph_moon">Lua</option>
                <option value="mars" data-i18n="eph_mars">Marte</option>
                <option value="jupiter" data-i18n="eph_jupiter">Júpiter</option>
                <option value="saturn" data-i18n="eph_saturn">Saturno</option>
            </select>
        </label>
        <button onclick="calcISS()" data-i18n="eph_calculate">Calcular Distância</button>
    </div>
    <div id="results" data-i18n="eph_waiting">
        Aguardando cálculo...
    </div>
</article>
{% endblock %}

{% block scripts %}
<script>
async function calcISS() {
    const target = document.getElementById('target').value;
    const res = await fetch('{{ url_for("ephemeris.calculate_iss") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}'},
        body: JSON.stringify({ target })
    });
    const data = await res.json();
    document.getElementById('results').innerHTML = data.status === 'success' 
        ? `Distância: ${data.distance_au} AU` 
        : `Erro: ${data.message}`;
}
</script>
{% endblock %}
